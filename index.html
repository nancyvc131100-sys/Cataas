<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explora una galería de gatitos con búsqueda por etiquetas y paginación gracias a Cataas.">
  <title>Meow Garden | Explora la galería</title>

  <!-- Bootstrap 5: cuadrícula y componentes básicos. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Estilos personalizados. -->
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="site-header" id="inicio">
    <div class="container site-header-inner">
      <nav class="brand-row" aria-label="Navegación principal">
        <a class="brand" href="#inicio" aria-label="Meow Garden, inicio">
          <span class="brand-mark" aria-hidden="true">🐾</span>
          <span>ichina4ever<span class="brand-heart" aria-hidden="true">♡</span></span>
        </a>
        <span class="brand-note">miau</span>
      </nav>

      <div class="page-intro">
        <p class="eyebrow"><span aria-hidden="true">✿</span> PEQUEÑAS DOSIS DE FELICIDAD</p>
        <h1 id="titulo-galeria">Explora la galería</h1>
        <p class="section-description">Busca por etiquetas, descubre nuevos gatitos y disfruta de sus fotos y GIF.</p>
        <span class="intro-doodle" aria-hidden="true">ฅ^•ﻌ•^ฅ</span>
      </div>
    </div>
  </header>

  <main class="container gallery-container pb-5">
    <section class="search-panel" aria-label="Buscar gatos por etiqueta">
      <form id="formFiltro" class="row g-3 align-items-end">
        <div class="col-12 col-lg">
          <label for="inputEtiqueta" class="form-label">¿Qué gatito quieres encontrar?</label>
          <input
            id="inputEtiqueta"
            name="etiqueta"
            type="search"
            class="form-control search-input"
            list="listaEtiquetas"
            placeholder="Prueba con cute, orange o sleepy"
            autocomplete="off"
          >
          <datalist id="listaEtiquetas"></datalist>
        </div>
        <div class="col-6 col-lg-auto">
          <button class="btn btn-garden w-100" type="submit">Buscar gatitos</button>
        </div>
        <div class="col-6 col-lg-auto">
          <button class="btn btn-garden-light w-100" type="button" id="btnLimpiar">Ver todos</button>
        </div>
      </form>
    </section>

    <div class="gallery-status-row">
      <p id="resumen" class="gallery-summary mb-0" aria-live="polite"></p>
      <span class="summary-decoration" aria-hidden="true">✦</span>
    </div>

    <div id="estado" aria-live="polite"></div>
    <div id="galeria" class="row g-4"></div>

    <nav class="mt-5" aria-label="Paginación de la galería">
      <ul id="paginacion" class="pagination justify-content-center flex-wrap"></ul>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <p class="mb-0">Hecho con <span aria-label="amor">♡</span> y muchos bigotes.</p>
      <p class="mb-0 footer-credit">Imágenes y datos: <a href="https://cataas.com/" target="_blank" rel="noopener noreferrer">Cataas</a></p>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
